global:
  resolve_timeout: 5m

  # Gmail SMTP configuration
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "harishnaveen0904@gmail.com"
  smtp_auth_username: "harishnaveen0904@gmail.com"
  smtp_auth_password: "${SMTP_PASSWORD}"
  smtp_require_tls: true

route:
  receiver: "email-alerts"

  # Group related alerts together
  group_by:
    - alertname
    - severity

  # Wait 30 seconds before sending the first notification
  group_wait: 30s

  # Wait 5 minutes before sending an update for the same group
  group_interval: 5m

  # Repeat an unresolved alert every 4 hours
  repeat_interval: 4h

receivers:
  - name: "email-alerts"

    email_configs:
      - to: "harishnaveen0904@gmail.com"
        send_resolved: true
