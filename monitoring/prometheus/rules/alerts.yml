groups:
  - name: monitoring-alerts
    rules:

      # PostgreSQL CPU alert depends on per-container metrics from cAdvisor.
      - alert: PostgreSQLHighCPU
        expr: |
          100 * sum by (name) (
            rate(container_cpu_usage_seconds_total{
              name="monitoring-postgres",
              container="monitoring-postgres"
            }[5m])
          ) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL container CPU usage is high"
          description: "PostgreSQL container CPU usage has been above 80% of one CPU core for 5 minutes."

      # PostgreSQL memory alert depends on per-container metrics from cAdvisor.
      - alert: PostgreSQLHighMemory
        expr: |
          (
            100 * container_memory_working_set_bytes{
              name="monitoring-postgres",
              container="monitoring-postgres"
            }
            /
            container_spec_memory_limit_bytes{
              name="monitoring-postgres",
              container="monitoring-postgres"
            }
          ) > 80
          and
          container_spec_memory_limit_bytes{
            name="monitoring-postgres",
            container="monitoring-postgres"
          } > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL container memory usage is high"
          description: "PostgreSQL container memory usage has been above 80% of its configured memory limit for 5 minutes."

      - alert: HighSystemCPU
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "System CPU usage is high"
          description: "System CPU usage has been above 80% for 5 minutes."

      - alert: HighSystemMemory
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "System memory usage is high"
          description: "System memory usage has been above 80% for 5 minutes."

      - alert: HighDiskUsage
        expr: |
          (1 - (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/proc.*|/sys.*|/dev.*|/run.*"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/proc.*|/sys.*|/dev.*|/run.*"}
          )) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk usage is critically high"
          description: "System disk usage has exceeded 90% for 5 minutes."

      # Prometheus cannot scrape the PostgreSQL exporter.
      - alert: PostgreSQLExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL monitoring exporter is down"
          description: "Prometheus cannot scrape the PostgreSQL exporter."

      # PostgreSQL itself is unreachable. This is more reliable than cAdvisor
      # container_last_seen on Docker Desktop.
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL database is down"
          description: "The PostgreSQL exporter cannot connect to the PostgreSQL database."
