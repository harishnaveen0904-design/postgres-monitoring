groups:
  - name: monitoring-alerts
    rules:
      - alert: PostgreSQLHighCPU
        expr: docker_container_cpu_percent{name="monitoring-postgres"} > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL CPU usage is high"
          description: "The monitoring-postgres container CPU usage has been above 80% for 1 minute."

      - alert: PostgreSQLHighMemory
        expr: |
          100 * docker_container_memory_usage_bytes{name="monitoring-postgres"}
          / docker_container_memory_limit_bytes{name="monitoring-postgres"} > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL memory usage is high"
          description: "The monitoring-postgres container memory usage has been above 80% of its Docker memory limit for 5 minutes."

      - alert: HighSystemCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "System CPU usage is high"
          description: "System CPU usage has been above 80% for 5 minutes."

      - alert: HighSystemMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "System memory usage is high"
          description: "System memory usage has been above 80% for 5 minutes."

      - alert: HighDiskUsage
        expr: |
          (1 - (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/proc.*|/sys.*|/dev.*|/run.*"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/proc.*|/sys.*|/dev.*|/run.*"}
          )) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk usage is critically high"
          description: "System disk usage has exceeded 90% for 5 minutes."

      - alert: PostgreSQLExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL monitoring exporter is down"
          description: "Prometheus cannot scrape the PostgreSQL exporter."

      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL database is down"
          description: "The PostgreSQL exporter cannot connect to the PostgreSQL database."
